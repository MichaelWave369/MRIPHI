name: R6 MNE reference validation

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/mne_reference.py"
      - "scripts/test_mne_reference.py"
      - "scripts/requirements-reference.txt"
      - ".github/workflows/r6-reference.yml"
  push:
    branches: [main]
    paths:
      - "scripts/mne_reference.py"
      - "scripts/test_mne_reference.py"
      - "scripts/requirements-reference.txt"
      - ".github/workflows/r6-reference.yml"
  workflow_dispatch:

jobs:
  mne-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-reference.txt
      - name: Install reference dependencies
        run: python -m pip install --disable-pip-version-check --prefer-binary -r scripts/requirements-reference.txt
      - name: Independent synthetic EDF reference checks
        run: python -m unittest discover -s scripts -p "test_*.py" -v
