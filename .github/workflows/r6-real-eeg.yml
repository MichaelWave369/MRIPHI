name: R6.1 Real EEG Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/real-data-validation.test.ts"
      - "src/lib/edf.ts"
      - "src/lib/eeg-analysis.ts"
      - "src/lib/eeg-validation.ts"
      - "scripts/mne_reference.py"
      - "scripts/requirements-reference.txt"
      - ".github/workflows/r6-real-eeg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-edf-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-reference.txt
      - name: Configure runner-local private paths
        shell: bash
        run: |
          echo "MRIPHI_E2E_EDF=$RUNNER_TEMP/mriphi-public-edf/S001R01.edf" >> "$GITHUB_ENV"
          echo "MRIPHI_E2E_OUT=$RUNNER_TEMP/mriphi-public-edf/evidence" >> "$GITHUB_ENV"
      - name: Install project and independent analysis dependencies
        run: |
          npm install --no-audit --no-fund
          python -m pip install --disable-pip-version-check --prefer-binary -r scripts/requirements-reference.txt
      - name: Download exactly one public EDF, with bounded size
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MRIPHI_E2E_EDF")" "$MRIPHI_E2E_OUT"
          curl --fail --location --show-error --silent --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            --output "$MRIPHI_E2E_EDF" \
            "https://physionet.org/files/eegmmidb/1.0.0/S001/S001R01.edf"
          bytes=$(wc -c < "$MRIPHI_E2E_EDF")
          test "$bytes" -gt 1024
          test "$bytes" -le 134217728
          echo "Downloaded public EDF, size $bytes bytes; content SHA-256:"
          sha256sum "$MRIPHI_E2E_EDF" | cut -d' ' -f1
      - name: Calculate browser-engine metrics and verification requests
        env:
          MRIPHI_E2E_STAGE: request
        run: npx vitest run src/lib/real-data-validation.test.ts
      - name: Independently calculate three MNE references
        shell: bash
        run: |
          set -euo pipefail
          for n in 01 02 03; do
            python scripts/mne_reference.py \
              --edf "$MRIPHI_E2E_EDF" \
              --request "$MRIPHI_E2E_OUT/request-$n.json" \
              --out "$MRIPHI_E2E_OUT/reference-$n.json"
          done
      - name: Check numerical agreement and record complete evidence
        env:
          MRIPHI_E2E_STAGE: compare
        run: npx vitest run src/lib/real-data-validation.test.ts
      - name: Upload aggregated public-data ledger only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mriphi-r6-1-public-edf-ledger
          path: ${{ runner.temp }}/mriphi-public-edf/evidence/real-eeg-ledger.json
          if-no-files-found: ignore
          retention-days: 30
